name: Build ETG manuscript PDF

on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/build-paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/build-paper.yml"
  workflow_dispatch:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX manuscript and bibliography
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: etg-manuscript-pdf
          path: paper/main.pdf
          if-no-files-found: error
